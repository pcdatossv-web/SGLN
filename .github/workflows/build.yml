name: Build SGLN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Inventory bundled dependency assemblies
        shell: pwsh
        run: ./Pruebas/Inventario-Dependencias.ps1

      - name: Validate PowerShell scripts and test isolation config
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Pruebas\\Ejecutar-Pruebas.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'El ejecutor de pruebas contiene errores de sintaxis PowerShell.'
          }
          $migrationPath = Join-Path $PWD 'SGLN\\Scripts\\Migrar-CredencialesCompartidas.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($migrationPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'El script de migración de credenciales contiene errores de sintaxis PowerShell.'
          }
          [xml]$config = Get-Content 'Pruebas\\PruebaFuncional.exe.config'
          $connection = $config.configuration.connectionStrings.add.connectionString
          if ($connection -notmatch '(?i)Database=sgln_sv_pruebas' -or $connection -notmatch '(?i)SslMode=Preferred') {
            throw 'La configuración del arnés no apunta a sgln_sv_pruebas con TLS de pruebas esperado.'
          }

      - name: Build .NET Framework 4.8 solution
        shell: pwsh
        run: msbuild .\SGLN.sln /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Compile functional test harness
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'SGLN\bin\Release'
          $vbc = Join-Path $env:windir 'Microsoft.NET\Framework64\v4.0.30319\vbc.exe'
          & $vbc /nologo /quiet /codepage:65001 /target:exe "/out:$bin\PruebaFuncional.exe" "/r:$bin\SGLN.exe" "/r:$bin\MySql.Data.dll" "/r:$bin\System.Buffers.dll" "/r:$bin\System.Memory.dll" "/r:$bin\System.Numerics.Vectors.dll" /r:System.dll /r:System.Core.dll /r:System.Data.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Configuration.dll /r:System.Xml.dll "$PWD\Pruebas\PruebaFuncional.vb"
          if ($LASTEXITCODE -ne 0) { throw 'Falló la compilación del arnés de pruebas funcionales.' }
