name: Build SGLN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Inventory bundled dependency assemblies
        shell: pwsh
        run: ./Pruebas/Inventario-Dependencias.ps1

      - name: Validate PowerShell scripts and test isolation config
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Pruebas\\Ejecutar-Pruebas.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'El ejecutor de pruebas contiene errores de sintaxis PowerShell.'
          }
          $migrationPath = Join-Path $PWD 'SGLN\\Scripts\\Migrar-CredencialesCompartidas.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($migrationPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'El script de migración de credenciales contiene errores de sintaxis PowerShell.'
          }
          [xml]$config = Get-Content 'Pruebas\\PruebaFuncional.exe.config'
          $connection = $config.configuration.connectionStrings.add.connectionString
          if ($connection -notmatch '(?i)Database=sgln_sv_pruebas' -or $connection -notmatch '(?i)SslMode=Preferred') {
            throw 'La configuración del arnés no apunta a sgln_sv_pruebas con TLS de pruebas esperado.'
          }
          $conexionSource = Get-Content 'SGLN\\Datos\\ConfiguracionConexion.vb' -Raw
          $inicioCifrar = $conexionSource.IndexOf('Private Shared Function Cifrar(')
          $finCifrar = $conexionSource.IndexOf('Private Shared Function Descifrar(', $inicioCifrar)
          if ($inicioCifrar -lt 0 -or $finCifrar -le $inicioCifrar) {
            throw 'No se pudo localizar el bloque de cifrado de credenciales.'
          }
          $bloqueCifrar = $conexionSource.Substring($inicioCifrar, $finCifrar - $inicioCifrar)
          if ($bloqueCifrar -notmatch 'DataProtectionScope\.CurrentUser' -or
              $bloqueCifrar -match 'DataProtectionScope\.LocalMachine') {
            throw 'Las nuevas credenciales deben cifrarse exclusivamente con DPAPI CurrentUser.'
          }
          if ($conexionSource -notmatch 'LeerRegistro\(RegistryHive\.LocalMachine, False\)') {
            throw 'La configuración compartida HKLM no debe descifrar credenciales.'
          }
          $triggersSql = Get-Content 'SGLN\\Scripts\\Triggers_MySQL.sql' -Raw
          $privilegiosSql = Get-Content 'SGLN\\Scripts\\Privilegios_Minimos.sql' -Raw
          $usuarioRepo = Get-Content 'SGLN\\Datos\\Repositorios\\UsuarioRepositorio.vb' -Raw
          $servicioUsuarios = Get-Content 'SGLN\\Servicios\\ServicioUsuarios.vb' -Raw
          $servicioRoles = Get-Content 'SGLN\\Servicios\\ServicioRoles.vb' -Raw
          $configRepo = Get-Content 'SGLN\\Datos\\Repositorios\\ConfiguracionRepositorio.vb' -Raw
          $casoRepo = Get-Content 'SGLN\\Datos\\Repositorios\\CasoRepositorio.vb' -Raw
          $servicioCasos = Get-Content 'SGLN\\Servicios\\ServicioCasos.vb' -Raw
          $servicioPlazos = Get-Content 'SGLN\\Servicios\\ServicioPlazos.vb' -Raw
          $servicioCumplimiento = Get-Content 'SGLN\\Servicios\\ServicioCumplimiento.vb' -Raw
          $servicioDocumentos = Get-Content 'SGLN\\Servicios\\ServicioDocumentos.vb' -Raw
          $calculadoraDias = Get-Content 'SGLN\\Servicios\\CalculadoraDiasHabiles.vb' -Raw
          $servicioProtocolo = Get-Content 'SGLN\\Servicios\\ServicioProtocolo.vb' -Raw
          $protocoloRepo = Get-Content 'SGLN\\Datos\\Repositorios\\ProtocoloRepositorio.vb' -Raw
          $servicioAlertas = Get-Content 'SGLN\\Servicios\\ServicioAlertas.vb' -Raw
          $programa = Get-Content 'SGLN\\Program.vb' -Raw
          $servicioClientes = Get-Content 'SGLN\\Servicios\\ServicioClientes.vb' -Raw
          $servicioEntidades = Get-Content 'SGLN\\Servicios\\ServicioEntidades.vb' -Raw
          if ($triggersSql -notmatch '(?i)CREATE PROCEDURE sp_EliminarUsuarioSeguro' -or
              $triggersSql -notmatch '(?i)CREATE TRIGGER trg_rol_permiso_admin_bi' -or
              -not $triggersSql.Contains("NEW.Codigo LIKE 'config.%'") -or
              -not $triggersSql.Contains('SET TRANSACTION ISOLATION LEVEL SERIALIZABLE')) {
            throw 'Faltan los candados SQL de permisos administrativos o eliminación segura.'
          }
          if (-not $configRepo.Contains('Permisos.TieneAcceso("config.editar")') -or
              -not $configRepo.Contains('Permisos.TieneAcceso("config.feriados")') -or
              -not $configRepo.Contains('Permisos.TieneAcceso("config.respaldos")')) {
            throw 'Faltan las comprobaciones de permisos en el repositorio de configuración.'
          }
          $terminadorDoble = ([string][char]36) + ([string][char]36)
          if (-not $triggersSql.Contains('DELIMITER ' + $terminadorDoble) -or
              -not $triggersSql.Contains('DROP PROCEDURE IF EXISTS sp_EliminarUsuarioSeguro' + $terminadorDoble) -or
              -not $triggersSql.Contains('END' + $terminadorDoble)) {
            throw 'El archivo de candados MySQL tiene delimitadores incompletos.'
          }
          if ($privilegiosSql -match '(?i)GRANT\s+DELETE\s+ON\s+sgln_sv\.Usuarios' -or
              $privilegiosSql -notmatch '(?i)GRANT EXECUTE ON PROCEDURE sgln_sv\.sp_EliminarUsuarioSeguro') {
            throw 'La cuenta sgln_app debe usar el procedimiento para eliminar usuarios y no tener DELETE directo.'
          }
          if ($privilegiosSql -notmatch '(?i)GRANT SELECT ON sgln_sv\.Permisos' -or
              $privilegiosSql -match '(?i)GRANT SELECT, INSERT, UPDATE ON sgln_sv\.Permisos') {
            throw 'El catálogo maestro de permisos debe ser de solo lectura para sgln_app.'
          }
          $inicializador = Get-Content 'SGLN\\Datos\\InicializadorBD.vb' -Raw
          if ($inicializador -match 'SembrarPermisosAdicionales' -or
              $inicializador -notmatch 'Codigo = ''config.editar''') {
            throw 'La aplicación no debe modificar el catálogo de permisos; debe verificarlo al iniciar.'
          }
          if ($casoRepo -notmatch 'SELECT ID_Cliente, Numero_Expediente FROM Casos WHERE ID = @id FOR UPDATE' -or
              $casoRepo -notmatch 'Actuaciones_Procesales WHERE ID_Caso' -or
              $casoRepo -notmatch 'Documentos WHERE ID_Caso' -or
              $casoRepo -notmatch 'Operaciones_LDAFT WHERE ID_Caso') {
            throw 'La identidad del expediente debe protegerse frente a cambios cuando existe historial.'
          }
          if ($servicioCasos -notmatch 'El número de expediente no puede superar 80 caracteres' -or
              $servicioCasos -notmatch 'Catch ex As InvalidOperationException') {
            throw 'Faltan validaciones de entrada o manejo de reglas históricas en el servicio de casos.'
          }
          if ($servicioPlazos -notmatch 'casos.confirmar_plazo' -or
              $servicioPlazos -notmatch 'FechaNotificacion = Date.MinValue' -or
              $casoRepo -notmatch 'CONFIRMAR PLAZO') {
            throw 'Los cálculos y confirmaciones de plazos deben estar protegidos y auditados.'
          }
          if ($servicioCumplimiento -notmatch 'fecha de solicitud no es válida' -or
              $servicioCumplimiento -notmatch 'No se pudo calcular el vencimiento ARCO' -or
              $servicioCumplimiento -notmatch 'IDCaso.Value <= 0' -or
              $servicioCumplimiento -notmatch 'caracter > "Z"c') {
            throw 'Faltan validaciones de fechas y manejo de errores en cumplimiento ARCO.'
          }
          if ($servicioDocumentos -notmatch 'ValidarReferencias' -or
              $servicioDocumentos -notmatch 'El tipo de documento no puede superar 60 caracteres') {
            throw 'Faltan validaciones de referencias y metadatos documentales.'
          }
          if ($calculadoraDias -notmatch 'MaxDiasHabiles' -or
              $calculadoraDias -notmatch 'MaxRangoConteoDias' -or
              $calculadoraDias -notmatch 'fechaNotificacion = Date.MinValue') {
            throw 'La calculadora de días hábiles debe limitar fechas y rangos excesivos.'
          }
          if ($servicioProtocolo -notmatch 'FechaAutorizacion = Date.MinValue' -or
              $servicioProtocolo -notmatch 'FechaHoraOtorgamiento = Date.MinValue' -or
              $servicioProtocolo -notmatch 'libro.ID < 0' -or
              $servicioProtocolo -notmatch 'instrumento.ID < 0' -or
              $servicioProtocolo -notmatch 'validar referencias de escritura') {
            throw 'El protocolo debe validar fechas obligatorias y controlar errores al consultar referencias.'
          }
          if ($protocoloRepo -notmatch "Estado IN \('Cerrado', 'Entregado'\)" -or
              $protocoloRepo -notmatch 'Indice_Generado = 0' -or
              $servicioProtocolo -notmatch 'cambió de estado y no se pudo marcar el índice' -or
              $servicioProtocolo -notmatch 'El índice de este libro ya fue generado') {
            throw 'El índice notarial solo puede marcarse después del cierre y debe detectar cambios concurrentes.'
          }
          if ($servicioAlertas -notmatch 'FechaLimiteEntrega' -or
              $servicioAlertas -match 'INTERVAL 15 DAY') {
            throw 'Las alertas de entrega al Notariado deben usar el plazo hábil configurado, no días naturales fijos.'
          }
          if ($programa -notmatch 'Application.ThreadException' -or
              $programa -notmatch 'AppDomain.CurrentDomain.UnhandledException' -or
              $programa -notmatch 'RegistrarExcepcionGlobal') {
            throw 'La aplicación debe registrar excepciones globales de interfaz y proceso.'
          }
          if ($servicioClientes -notmatch 'FechaNacimiento.Value.Year < 1000' -or
              $servicioClientes -notmatch 'FechaVerificacionListas.Value.Year < 1000' -or
              $servicioEntidades -notmatch 'FechaVerificacionListas.Value.Year < 1000') {
            throw 'Los servicios deben rechazar fechas fuera del rango DATE admitido por MySQL.'
          }
          if ($servicioUsuarios -notmatch 'No puede cambiar su propio rol' -or
              $servicioUsuarios -notmatch 'Para cambiar su propia clave') {
            throw 'El mantenimiento de usuarios debe impedir cambios de rol propios y restablecimientos sin clave actual.'
          }
          if ($servicioRoles -notmatch 'descripcion.Trim().Length > 200' -or
              $servicioRoles -notmatch 'If id <= 0 Then Return Respuesta.Fallo') {
            throw 'El servicio de roles debe validar la longitud de descripción y el identificador.'
          }
          if ($usuarioRepo -notmatch '(?i)CALL sp_EliminarUsuarioSeguro') {
            throw 'El repositorio de usuarios no está usando el procedimiento SQL protegido.'
          }
          if ($usuarioRepo -notmatch 'UPDATE Intentos_Acceso SET Intentos = 0') {
            throw 'El restablecimiento de contraseña debe retirar el bloqueo de acceso en la misma transacción.'
          }

      - name: Build .NET Framework 4.8 solution
        shell: pwsh
        run: msbuild .\SGLN.sln /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Compile functional test harness
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'SGLN\bin\Release'
          $vbc = Join-Path $env:windir 'Microsoft.NET\Framework64\v4.0.30319\vbc.exe'
          & $vbc /nologo /quiet /codepage:65001 /target:exe "/out:$bin\PruebaFuncional.exe" "/r:$bin\SGLN.exe" "/r:$bin\MySql.Data.dll" "/r:$bin\System.Buffers.dll" "/r:$bin\System.Memory.dll" "/r:$bin\System.Numerics.Vectors.dll" /r:System.dll /r:System.Core.dll /r:System.Data.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Configuration.dll /r:System.Xml.dll "$PWD\Pruebas\PruebaFuncional.vb"
          if ($LASTEXITCODE -ne 0) { throw 'Falló la compilación del arnés de pruebas funcionales.' }
