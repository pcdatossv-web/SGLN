name: Build SGLN

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Inventory bundled dependency assemblies
        shell: pwsh
        run: ./Pruebas/Inventario-Dependencias.ps1

      - name: Validate PowerShell scripts and test isolation config
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Pruebas\\Ejecutar-Pruebas.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'El ejecutor de pruebas contiene errores de sintaxis PowerShell.'
          }
          $migrationPath = Join-Path $PWD 'SGLN\\Scripts\\Migrar-CredencialesCompartidas.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($migrationPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'El script de migración de credenciales contiene errores de sintaxis PowerShell.'
          }
          [xml]$config = Get-Content 'Pruebas\\PruebaFuncional.exe.config'
          $connection = $config.configuration.connectionStrings.add.connectionString
          if ($connection -notmatch '(?i)Database=sgln_sv_pruebas' -or $connection -notmatch '(?i)SslMode=Preferred') {
            throw 'La configuración del arnés no apunta a sgln_sv_pruebas con TLS de pruebas esperado.'
          }
          $conexionSource = Get-Content 'SGLN\\Datos\\ConfiguracionConexion.vb' -Raw
          $inicioCifrar = $conexionSource.IndexOf('Private Shared Function Cifrar(')
          $finCifrar = $conexionSource.IndexOf('Private Shared Function Descifrar(', $inicioCifrar)
          if ($inicioCifrar -lt 0 -or $finCifrar -le $inicioCifrar) {
            throw 'No se pudo localizar el bloque de cifrado de credenciales.'
          }
          $bloqueCifrar = $conexionSource.Substring($inicioCifrar, $finCifrar - $inicioCifrar)
          if ($bloqueCifrar -notmatch 'DataProtectionScope\.CurrentUser' -or
              $bloqueCifrar -match 'DataProtectionScope\.LocalMachine') {
            throw 'Las nuevas credenciales deben cifrarse exclusivamente con DPAPI CurrentUser.'
          }
          if ($conexionSource -match 'datos\.Password\s*=\s*constructor\.Password' -or
              $conexionSource -match 'Respaldos_Clave' -or
              $configRepo -match 'Respaldos_Clave') {
            throw 'Las contraseñas MySQL y de respaldo no deben tener fallback en texto plano desde App.config.'
          }
          if ($conexionSource -notmatch 'LeerRegistro\(RegistryHive\.LocalMachine, False\)') {
            throw 'La configuración compartida HKLM no debe descifrar credenciales.'
          }
          $triggersSql = Get-Content 'SGLN\\Scripts\\Triggers_MySQL.sql' -Raw
          $privilegiosSql = Get-Content 'SGLN\\Scripts\\Privilegios_Minimos.sql' -Raw
          $usuarioRepo = Get-Content 'SGLN\\Datos\\Repositorios\\UsuarioRepositorio.vb' -Raw
          $permisosSource = Get-Content 'SGLN\\Servicios\\Permisos.vb' -Raw
          $rolRepo = Get-Content 'SGLN\\Datos\\Repositorios\\RolRepositorio.vb' -Raw
          $documentoRepo = Get-Content 'SGLN\\Datos\\Repositorios\\DocumentoRepositorio.vb' -Raw
          $clienteRepo = Get-Content 'SGLN\\Datos\\Repositorios\\ClienteRepositorio.vb' -Raw
          $entidadRepo = Get-Content 'SGLN\\Datos\\Repositorios\\EntidadRepositorio.vb' -Raw
          $casoRepo = Get-Content 'SGLN\\Datos\\Repositorios\\CasoRepositorio.vb' -Raw
          $cumplimientoRepo = Get-Content 'SGLN\\Datos\\Repositorios\\CumplimientoRepositorio.vb' -Raw
          $auditoriaRepo = Get-Content 'SGLN\\Datos\\Repositorios\\AuditoriaRepositorio.vb' -Raw
          $usuarioRepo = Get-Content 'SGLN\\Datos\\Repositorios\\UsuarioRepositorio.vb' -Raw
          $protocoloRepoDatos = Get-Content 'SGLN\\Datos\\Repositorios\\ProtocoloRepositorio.vb' -Raw
          $seguridadClave = Get-Content 'SGLN\\Servicios\\SeguridadClave.vb' -Raw
          $servicioUsuarios = Get-Content 'SGLN\\Servicios\\ServicioUsuarios.vb' -Raw
          $servicioRoles = Get-Content 'SGLN\\Servicios\\ServicioRoles.vb' -Raw
          $configRepo = Get-Content 'SGLN\\Datos\\Repositorios\\ConfiguracionRepositorio.vb' -Raw
          $catalogoRepo = Get-Content 'SGLN\\Datos\\Repositorios\\CatalogoRepositorio.vb' -Raw
          $casoRepo = Get-Content 'SGLN\\Datos\\Repositorios\\CasoRepositorio.vb' -Raw
          $servicioCasos = Get-Content 'SGLN\\Servicios\\ServicioCasos.vb' -Raw
          $servicioPlazos = Get-Content 'SGLN\\Servicios\\ServicioPlazos.vb' -Raw
          $servicioCumplimiento = Get-Content 'SGLN\\Servicios\\ServicioCumplimiento.vb' -Raw
          $frmCumplimiento = Get-Content 'SGLN\\UI\\FrmCumplimiento.vb' -Raw
          $servicioDocumentos = Get-Content 'SGLN\\Servicios\\ServicioDocumentos.vb' -Raw
          $calculadoraDias = Get-Content 'SGLN\\Servicios\\CalculadoraDiasHabiles.vb' -Raw
          $servicioProtocolo = Get-Content 'SGLN\\Servicios\\ServicioProtocolo.vb' -Raw
          $frmProtocolo = Get-Content 'SGLN\\UI\\FrmProtocolo.vb' -Raw
          $protocoloRepo = Get-Content 'SGLN\\Datos\\Repositorios\\ProtocoloRepositorio.vb' -Raw
          $servicioAlertas = Get-Content 'SGLN\\Servicios\\ServicioAlertas.vb' -Raw
          $programa = Get-Content 'SGLN\\Program.vb' -Raw
          $servicioClientes = Get-Content 'SGLN\\Servicios\\ServicioClientes.vb' -Raw
          $servicioEntidades = Get-Content 'SGLN\\Servicios\\ServicioEntidades.vb' -Raw
          if ($triggersSql -notmatch '(?i)CREATE PROCEDURE sp_EliminarUsuarioSeguro' -or
              $triggersSql -notmatch '(?i)CREATE TRIGGER trg_rol_permiso_admin_bi' -or
              -not $triggersSql.Contains("NEW.Codigo LIKE 'config.%'") -or
              -not $triggersSql.Contains('SET TRANSACTION ISOLATION LEVEL SERIALIZABLE')) {
            throw 'Faltan los candados SQL de permisos administrativos o eliminación segura.'
          }
          if (-not $configRepo.Contains('Permisos.TieneAcceso("config.ver")') -or
              -not $configRepo.Contains('Permisos.TieneAcceso("config.editar")') -or
              -not $configRepo.Contains('Permisos.TieneAcceso("config.feriados")') -or
              -not $configRepo.Contains('Permisos.TieneAcceso("config.seguridad")') -or
              -not $configRepo.Contains('Permisos.TieneAcceso("config.respaldos")') -or
              -not $configRepo.Contains('String.Equals(claveNormalizada, "Carpeta_Respaldos"') -or
              -not $configRepo.Contains('If Not puedeLeer Then Return ""')) {
            throw 'Faltan las comprobaciones de permisos por clave en el repositorio de configuración.'
          }
          if ($configRepo -notmatch 'usuario.Any\(Function\(caracter As Char\) Char.IsControl\(caracter\)\)' -or
              $configRepo -notmatch 'clave.Any\(Function\(caracter As Char\) Char.IsControl\(caracter\)\)') {
            throw 'Las credenciales del archivo de opciones de mysqldump deben rechazar caracteres de control.'
          }
          if ($configRepo -notmatch 'ValidarCarpetaSinEnlaces\(carpetaConfigurada\)' -or
              $configRepo -notmatch 'File.Move\(temporalSalida, destinoFinal\)' -or
              $configRepo -match 'File.Replace\(temporalSalida') {
            throw 'El repositorio de respaldos debe validar la carpeta y nunca sobrescribir un archivo existente.'
          }
          $servicioConfig = Get-Content 'SGLN\\Servicios\\ServicioConfiguracion.vb' -Raw
          if (-not $catalogoRepo.Contains('Permisos.TieneAcceso("config.editar")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("config.ver")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("cumplimiento.operaciones")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("protocolo.entregar")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("casos.ver")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("casos.gestionar")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("config.feriados")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("casos.confirmar_plazo")') -or
              -not $catalogoRepo.Contains('Permisos.TieneAcceso("protocolo.ver")') -or
              -not $catalogoRepo.Contains('Carpeta_Documentos') -or
              -not $catalogoRepo.Contains('Carpeta_Respaldos') -or
              $catalogoRepo.Contains('clave & " = " & valor')) {
            throw 'El repositorio de catálogos debe proteger tanto configuración como catálogos judiciales y feriados.'
          }
          if (-not $servicioConfig.Contains('If EsClaveReservada(clave) Then') -or
              -not $servicioConfig.Contains('StringComparison.OrdinalIgnoreCase') -or
              -not $configRepo.Contains('Carpeta_Documentos') -or
              -not $configRepo.Contains('Carpeta_Respaldos')) {
            throw 'Las rutas reservadas deben protegerse también en el repositorio de configuración.'
          }
          $terminadorDoble = ([string][char]36) + ([string][char]36)
          if (-not $triggersSql.Contains('DELIMITER ' + $terminadorDoble) -or
              -not $triggersSql.Contains('DROP PROCEDURE IF EXISTS sp_EliminarUsuarioSeguro' + $terminadorDoble) -or
              -not $triggersSql.Contains('END' + $terminadorDoble)) {
            throw 'El archivo de candados MySQL tiene delimitadores incompletos.'
          }
          if ($privilegiosSql -match '(?i)GRANT\s+DELETE\s+ON\s+sgln_sv\.Usuarios' -or
              $privilegiosSql -notmatch '(?i)GRANT EXECUTE ON PROCEDURE sgln_sv\.sp_EliminarUsuarioSeguro') {
            throw 'La cuenta sgln_app debe usar el procedimiento para eliminar usuarios y no tener DELETE directo.'
          }
          if ($privilegiosSql -notmatch '(?i)GRANT SELECT ON sgln_sv\.Permisos' -or
              $privilegiosSql -match '(?i)GRANT SELECT, INSERT, UPDATE ON sgln_sv\.Permisos') {
            throw 'El catálogo maestro de permisos debe ser de solo lectura para sgln_app.'
          }
          $inicializador = Get-Content 'SGLN\\Datos\\InicializadorBD.vb' -Raw
          if ($inicializador -match 'SembrarPermisosAdicionales' -or
              $inicializador -notmatch 'Codigo = ''config.editar''' -or
              -not $inicializador.Contains('Array.IndexOf(recursos, nombreRecurso)')) {
            throw 'El inicializador debe verificar el catálogo sin modificarlo y localizar recursos sin abrir flujos innecesarios.'
          }
          if ($casoRepo -notmatch 'SELECT ID_Cliente, Numero_Expediente FROM Casos WHERE ID = @id FOR UPDATE' -or
              $casoRepo -notmatch 'Actuaciones_Procesales WHERE ID_Caso' -or
              $casoRepo -notmatch 'Documentos WHERE ID_Caso' -or
              $casoRepo -notmatch 'Operaciones_LDAFT WHERE ID_Caso') {
            throw 'La identidad del expediente debe protegerse frente a cambios cuando existe historial.'
          }
          if ($servicioCasos -notmatch 'El número de expediente no puede superar 80 caracteres' -or
              $servicioCasos -notmatch 'Catch ex As InvalidOperationException') {
            throw 'Faltan validaciones de entrada o manejo de reglas históricas en el servicio de casos.'
          }
          if ($servicioPlazos -notmatch 'casos.confirmar_plazo' -or
              $servicioPlazos -notmatch 'FechaNotificacion = Date.MinValue' -or
              $casoRepo -notmatch 'CONFIRMAR PLAZO') {
            throw 'Los cálculos y confirmaciones de plazos deben estar protegidos y auditados.'
          }
          if ($cumplimientoRepo -notmatch "Prorroga_Aplicada = 1 AND a.Fecha_Vencimiento_Prorroga IS NULL" -or
              $cumplimientoRepo -notmatch "THEN 'Revisar prórroga'" -or
              $frmCumplimiento -notmatch '"Revisar prórroga"') {
            throw 'Las solicitudes con prórroga sin fecha deben identificarse para revisión y nunca figurar como vencidas.'
          }
          if ($servicioAlertas -notmatch "ARCO revisar prórroga" -or
              $servicioAlertas -notmatch "Prorroga_Aplicada = 1 AND a.Fecha_Vencimiento_Prorroga IS NULL") {
            throw 'El panel de alertas debe advertir las solicitudes ARCO con prórrogas inconsistentes.'
          }
          if ($usuarioRepo -notmatch 'SELECT ID FROM Roles WHERE Protegido = 1 FOR UPDATE' -or
              $usuarioRepo -notmatch 'Serializa la desactivación de cuentas Administrador' -or
              $usuarioRepo -notmatch 'rolActualProtegido AndAlso Not rolProtegidoActual' -or
              $usuarioRepo -notmatch 'Debe quedar al menos un usuario administrador activo') {
            throw 'Las desactivaciones y cambios de rol concurrentes deben conservar al menos una cuenta Administrador activa.'
          }
          if ($usuarioRepo -notmatch 'BloquearYValidarRolActivo\(conexion, transaccion, idRol, rolProtegidoActual\)' -or
              $usuarioRepo -notmatch 'SELECT Protegido FROM Roles WHERE ID = @id AND Activo = 1 FOR UPDATE') {
            throw 'El alta y la asignación de usuarios deben bloquear y validar el rol activo dentro de la transacción.'
          }
          if ($auditoriaRepo -notmatch 'String.IsNullOrWhiteSpace\(accion\)' -or
              $auditoriaRepo -notmatch 'CType\(DBNull.Value, Object\)') {
            throw 'El filtro (Todos) de auditoría debe tratar la acción vacía como filtro opcional.'
          }
          if ($servicioCumplimiento -notmatch 'fecha de solicitud no es válida' -or
              $servicioCumplimiento -notmatch 'No se pudo calcular el vencimiento ARCO' -or
              $servicioCumplimiento -notmatch 'IDCaso.Value <= 0' -or
              $servicioCumplimiento -notmatch 'caracter > "Z"c') {
            throw 'Faltan validaciones de fechas y manejo de errores en cumplimiento ARCO.'
          }
          if ($servicioDocumentos -notmatch 'ValidarReferencias' -or
              $servicioDocumentos -notmatch 'TipoDocumentoValido\(tipoDocumento\)') {
            throw 'Faltan validaciones de referencias y metadatos documentales.'
          }
          if ($documentoRepo -notmatch 'TipoDocumentoValido\(documento.TipoDocumento\)' -or
              $documentoRepo -notmatch 'Permisos.TieneAcceso\("documentos.ver"\)' -or
              $documentoRepo -notmatch 'Permisos.TieneAcceso\("documentos.importar"\)' -or
              $documentoRepo -notmatch 'Permisos.TieneAcceso\("documentos.metadatos"\)' -or
              $documentoRepo -notmatch 'PuedeConsultarDocumentos' -or
              $documentoRepo -notmatch 'PuedeCargarCombosDocumentos') {
            throw 'El repositorio documental debe validar permisos en cada operación directa.'
          }
          if ($clienteRepo -notmatch 'Permisos.TieneAcceso\("clientes.ver"\)' -or
              $clienteRepo -notmatch 'Permisos.TieneAcceso\("clientes.gestionar"\)' -or
              $clienteRepo -notmatch 'Permisos.TieneAcceso\("clientes.desactivar"\)' -or
              $entidadRepo -notmatch 'Permisos.TieneAcceso\("entidades.ver"\)' -or
              $entidadRepo -notmatch 'Permisos.TieneAcceso\("entidades.gestionar"\)' -or
              $casoRepo -notmatch 'Permisos.TieneAcceso\("casos.ver"\)' -or
              $casoRepo -notmatch 'Permisos.TieneAcceso\("casos.gestionar"\)' -or
              $casoRepo -notmatch 'Permisos.TieneAcceso\("casos.confirmar_plazo"\)' -or
              $cumplimientoRepo -notmatch 'Permisos.TieneAcceso\("cumplimiento.operaciones"\)' -or
              $cumplimientoRepo -notmatch 'Permisos.TieneAcceso\("cumplimiento.arco"\)' -or
              $cumplimientoRepo -notmatch 'Permisos.TieneAcceso\("cumplimiento.reportar_uif"\)' -or
              $protocoloRepoDatos -notmatch 'Permisos.TieneAcceso\("protocolo.ver"\)' -or
              $protocoloRepoDatos -notmatch 'Permisos.TieneAcceso\("protocolo.gestionar"\)' -or
              $protocoloRepoDatos -notmatch 'Permisos.TieneAcceso\("protocolo.cerrar_libro"\)' -or
              $protocoloRepoDatos -notmatch 'Permisos.TieneAcceso\("protocolo.entregar"\)' -or
              $protocoloRepoDatos -notmatch 'Permisos.TieneAcceso\("protocolo.testimonios"\)') {
            throw 'Los repositorios de clientes, entidades y casos deben validar permisos de lectura y escritura.'
          }
          if ($seguridadClave -notmatch 'clave.Length > 128' -or
              $seguridadClave -notmatch 'EsClaveInicial\(claveAutenticada As String\)' -or
              $usuarioRepo -notmatch 'EsClaveInicial\(clave\)') {
            throw 'La seguridad de claves debe limitar entradas y detectar el primer ingreso sin repetir PBKDF2.'
          }
          if ($usuarioRepo -notmatch 'usuario.Length > 50' -or
              $usuarioRepo -notmatch 'PatronUsuario.IsMatch\(usuario\)' -or
              $usuarioRepo -notmatch 'clave.Length > 128') {
            throw 'El repositorio de autenticación debe limitar y validar entradas antes de consultar la base.'
          }
          if ($permisosSource -notmatch 'CargarPermisosDeRol\(idRol\)' -or
              $permisosSource -match '\.PermisosDeRol\(idRol\)' -or
              $rolRepo -notmatch 'Friend Function CargarPermisosDeRol') {
            throw 'La carga interna de permisos no debe volver a entrar en TieneAcceso y provocar recursión.'
          }
          if ($calculadoraDias -notmatch 'MaxDiasHabiles' -or
              $calculadoraDias -notmatch 'MaxRangoConteoDias' -or
              $calculadoraDias -notmatch 'fechaNotificacion = Date.MinValue') {
            throw 'La calculadora de días hábiles debe limitar fechas y rangos excesivos.'
          }
          if ($servicioProtocolo -notmatch 'FechaAutorizacion = Date.MinValue' -or
              $servicioProtocolo -notmatch 'FechaHoraOtorgamiento = Date.MinValue' -or
              $servicioProtocolo -notmatch 'libro.ID < 0' -or
              $servicioProtocolo -notmatch 'instrumento.ID < 0' -or
              $servicioProtocolo -notmatch 'validar referencias de escritura') {
            throw 'El protocolo debe validar fechas obligatorias y controlar errores al consultar referencias.'
          }
          $inicioPrepararIndice = $servicioProtocolo.IndexOf('Public Function GenerarIndice(')
          $finPrepararIndice = $servicioProtocolo.IndexOf('Public Function ConfirmarIndiceGenerado(', $inicioPrepararIndice)
          if ($protocoloRepo -notmatch "Estado IN \('Cerrado', 'Entregado'\)" -or
              $protocoloRepo -notmatch 'Indice_Generado = 0' -or
              $inicioPrepararIndice -lt 0 -or $finPrepararIndice -le $inicioPrepararIndice -or
              $servicioProtocolo.Substring($inicioPrepararIndice, $finPrepararIndice - $inicioPrepararIndice) -match 'MarcarIndiceGenerado' -or
              $servicioProtocolo -notmatch 'Public Function ConfirmarIndiceGenerado\(' -or
              $frmProtocolo -notmatch 'ExportarIndice\(True\)' -or
              $frmProtocolo -notmatch 'ConfirmarIndiceGenerado\(_idLibro\)') {
            throw 'El índice notarial solo debe marcarse después de exportar el CSV y con control de concurrencia.'
          }
          if ($servicioAlertas -notmatch 'FechaLimiteEntrega' -or
              $servicioAlertas -match 'INTERVAL 15 DAY') {
            throw 'Las alertas de entrega al Notariado deben usar el plazo hábil configurado, no días naturales fijos.'
          }
          if ($programa -notmatch 'Application.ThreadException' -or
              $programa -notmatch 'AppDomain.CurrentDomain.UnhandledException' -or
              $programa -notmatch 'RegistrarExcepcionGlobal') {
            throw 'La aplicación debe registrar excepciones globales de interfaz y proceso.'
          }
          if ($servicioClientes -notmatch 'FechaNacimiento.Value.Year < 1000' -or
              $servicioClientes -notmatch 'FechaVerificacionListas.Value.Year < 1000' -or
              $servicioEntidades -notmatch 'FechaVerificacionListas.Value.Year < 1000') {
            throw 'Los servicios deben rechazar fechas fuera del rango DATE admitido por MySQL.'
          }
          if ($servicioUsuarios -notmatch 'No puede cambiar su propio rol' -or
              $servicioUsuarios -notmatch 'Para cambiar su propia clave') {
            throw 'El mantenimiento de usuarios debe impedir cambios de rol propios y restablecimientos sin clave actual.'
          }
          if ($rolRepo -notmatch 'SELECT COUNT\(\*\) FROM Usuarios WHERE ID_Rol = @id' -or
              $rolRepo -notmatch 'SELECT Protegido FROM Roles WHERE ID = @id FOR UPDATE' -or
              $rolRepo -notmatch 'No se puede desactivar un rol con usuarios asignados' -or
              $rolRepo -notmatch 'No se puede eliminar un rol con usuarios asignados') {
            throw 'La desactivación y eliminación de roles deben revalidar usuarios asignados dentro de la transacción.'
          }
          if (-not $servicioRoles.Contains('descripcion.Trim().Length > 200') -or
              -not $servicioRoles.Contains('If id <= 0 Then Return Respuesta.Fallo')) {
            throw 'El servicio de roles debe validar la longitud de descripción y el identificador.'
          }
          if ($usuarioRepo -notmatch '(?i)CALL sp_EliminarUsuarioSeguro') {
            throw 'El repositorio de usuarios no está usando el procedimiento SQL protegido.'
          }
          if ($usuarioRepo -notmatch 'UPDATE Intentos_Acceso SET Intentos = 0') {
            throw 'El restablecimiento de contraseña debe retirar el bloqueo de acceso en la misma transacción.'
          }

      - name: Build .NET Framework 4.8 solution
        shell: pwsh
        run: msbuild .\SGLN.sln /m /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: Compile functional test harness
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'SGLN\bin\Release'
          $vbc = Join-Path $env:windir 'Microsoft.NET\Framework64\v4.0.30319\vbc.exe'
          & $vbc /nologo /quiet /codepage:65001 /target:exe "/out:$bin\PruebaFuncional.exe" "/r:$bin\SGLN.exe" "/r:$bin\MySql.Data.dll" "/r:$bin\System.Buffers.dll" "/r:$bin\System.Memory.dll" "/r:$bin\System.Numerics.Vectors.dll" /r:System.dll /r:System.Core.dll /r:System.Data.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Configuration.dll /r:System.Xml.dll "$PWD\Pruebas\PruebaFuncional.vb"
          if ($LASTEXITCODE -ne 0) { throw 'Falló la compilación del arnés de pruebas funcionales.' }
